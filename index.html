<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级2048✨</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;user-select: none;-webkit-user-select: none;}
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #faf8ef;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }
        /* 截图同款公告栏 */
        .notice-bar {
            width: 100%;
            max-width: 500px;
            height: 50px;
            line-height: 50px;
            background: #ff7f7f;
            color: #fff;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 3px 8px rgba(255,127,127,0.3);
        }
        /* 头部：分数+重置按钮 */
        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .score-box {
            background: #bbada0;
            padding: 12px 20px;
            border-radius: 10px;
            color: #fff;
            text-align: center;
        }
        .score-box .title {font-size: 14px;opacity: 0.8;}
        .score-box #score {font-size: 24px;font-weight: bold;margin-top: 4px;}
        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #8f7a66;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {background: #786553;}
        /* ✅ 新增：5个操控按钮容器（上下左右+管理员）- 双端适配 */
        .control-btn-group {
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            display: grid;
            grid-template-areas:
                ". up ."
                "left down right"
                "admin admin admin";
            gap: 10px;
            justify-content: center;
        }
        .control-btn {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 10px;
            background: #8f7a66;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn.admin {
            grid-area: admin;
            width: 100%;
            height: 60px;
            background: #ff7f7f;
            margin-top: 10px;
        }
        .control-btn.up {grid-area: up;}
        .control-btn.left {grid-area: left;}
        .control-btn.down {grid-area: down;}
        .control-btn.right {grid-area: right;}
        .control-btn:hover {background: #786553;}
        .control-btn.admin:hover {background: #ff6060;}
        /* 游戏核心面板 - 无动画样式 */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 500px;
            background: #bbada0;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(187,173,160,0.4);
            overflow: hidden;
        }
        .grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
        }
        /* 方块样式 - 移除所有动画过渡 */
        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #776e65;
        }
        /* 截图同款排行榜 */
        .rank-box {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .rank-box h3 {
            color: #ff7f7f;
            text-align: center;
            font-size: 22px;
            margin-bottom: 18px;
            letter-spacing: 3px;
        }
        .rank-list {list-style: none;}
        .rank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 17px;
        }
        .rank-item:last-child {border: none;}
        .rank-num {
            width: 30px;
            height: 30px;
            line-height: 30px;
            border-radius: 50%;
            text-align: center;
            color: #fff;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .rank-num.first {background: #ffd700;}
        .rank-num.second {background: #c0c0c0;}
        .rank-num.third {background: #cd7f32;}
        .rank-num.other {background: #888;}
        .rank-name {flex: 1;color: #333;font-weight: 500;}
        .rank-score {color: #ff7f7f;font-weight: bold;margin-left: 15px;}
        /* 分数修改弹窗 */
        .score-modal {
            position: fixed;
            top: 50%;left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;max-width: 400px;
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 9999;
            display: none;
        }
        .score-modal h2 {
            color: #ff7f7f;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .score-modal input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 25px;
        }
        .modal-btn-group {display: flex;gap: 10px;}
        .modal-btn-group button {flex:1;padding:12px 0;}
        .confirm-btn {background: #4fc3a1;color: #fff;}
        .cancel-btn {background: #ff7f7f;color: #fff;}
        /* 遮罩层 */
        .mask {
            position: fixed;
            top:0;left:0;right:0;bottom:0;
            background: rgba(0,0,0,0.5);
            z-index: 9998;
            display: none;
        }
        /* 方块配色映射 - 无动画 */
        :root {
            --c2:#eee4da;--c4:#ede0c8;--c8:#f2b179;--c16:#f59563;--c32:#f67c5f;
            --c64:#f65e3b;--c128:#edcf72;--c256:#edcc61;--c512:#edc850;--c1024:#edc53f;
            --c2048:#edc22e;--c-max:#3c3a32;--tc-light:#776e65;--tc-dark:#f9f6f2;
        }
        /* 响应式适配手机（按钮自适应） */
        @media (max-width: 500px) {
            .game-container {width: 100%;height: calc(100vw - 30px);}
            .cell {font-size: 5vw;}
            .notice-bar {font-size: 16px;height: 45px;line-height: 45px;}
            .rank-item {font-size: 15px;}
            .control-btn {width: 70px;height: 70px;font-size: 16px;}
            .control-btn.admin {height: 50px;font-size: 14px;}
        }
    </style>
</head>
<body>
    <!-- 【代码修改区1】公告栏 - 直接改文字 -->
    <div class="notice-bar">📢 想上榜分数截图钉钉发谢欣智 📢</div>

    <!-- 头部：分数展示+重置按钮 -->
    <div class="header">
        <div class="score-box">
            <div class="title">我的分数</div>
            <div id="score">0</div>
        </div>
        <button class="btn" id="reset-game">重置游戏</button>
    </div>

    <!-- ✅ 新增：5个操控按钮（上下左右+管理员） -->
    <div class="control-btn-group">
        <button class="control-btn up" id="btn-up">↑ 上</button>
        <button class="control-btn left" id="btn-left">← 左</button>
        <button class="control-btn down" id="btn-down">↓ 下</button>
        <button class="control-btn right" id="btn-right">→ 右</button>
        <button class="control-btn admin" id="btn-admin">🔧 管理员验证</button>
    </div>

    <!-- 游戏核心区 -->
    <div class="game-container">
        <div class="grid" id="grid"></div>
    </div>

    <!-- 【代码修改区2】排行榜 - 直接改名字/分数 -->
    <div class="rank-box">
        <h3>🏆 班级高分榜 🏆</h3>
        <ul class="rank-list" id="rank-list">
            <li class="rank-item">
                <span class="rank-num first">1</span>
                <span class="rank-name">谢欣智</span>
                <span class="rank-score">4096</span>
            </li>
            <li class="rank-item">
                <span class="rank-num second">2</span>
                <span class="rank-name">暂无</span>
                <span class="rank-score">0</span>
            </li>
            <li class="rank-item">
                <span class="rank-num third">3</span>
                <span class="rank-name">暂无</span>
                <span class="rank-score">0</span>
            </li>
            <li class="rank-item">
                <span class="rank-num other">4</span>
                <span class="rank-name">暂无</span>
                <span class="rank-score">0</span>
            </li>
            <li class="rank-item">
                <span class="rank-num other">5</span>
                <span class="rank-name">暂无</span>
                <span class="rank-score">0</span>
            </li>
        </ul>
    </div>

    <!-- 遮罩层 -->
    <div class="mask" id="mask"></div>

    <!-- 分数修改弹窗 -->
    <div class="score-modal" id="score-modal">
        <h2>✏️ 修改当前分数</h2>
        <input type="number" id="score-input" placeholder="输入目标分数，例如999999999" min="0">
        <div class="modal-btn-group">
            <button class="btn confirm-btn" id="confirm-score">确认修改</button>
            <button class="btn cancel-btn" id="cancel-score">取消关闭</button>
        </div>
    </div>

    <script>
        const gridDom = document.getElementById('grid');
        const scoreDom = document.getElementById('score');
        const resetBtn = document.getElementById('reset-game');
        const scoreModal = document.getElementById('score-modal');
        const mask = document.getElementById('mask');
        const scoreInput = document.getElementById('score-input');
        const CELL_COUNT = 4; // 
        let grid = [];       
        let score = 0;   

        let isAdminMode = false; 
        const ADMIN_TRIGGER = '17c2048';
        let adminInputCache = ''; 

    
        const BLOCK_CONFIG = {
            2: '2',4:'4',8:'8',16:'16',32:'32',64:'64',128:'128',256:'256',
            512:'512',1024:'1024',2048:'2048',4096:'4096',8192:'8192',16384:'16384',
            32768:'32768',65536:'65536',131072:'131072',262144:'262144',524288:'524288',
            1048576:'1048576',2097152:'2097152',4194304:'4194304',8388608:'8388608',
            16777216:'16777216',33554432:'33554432',67108864:'67108864',134217728:'134217728',
            268435456:'268435456',536870912:'536870912',1073741824:'1073741824',2147483648:'2147483648'
        };

        const CELL_STYLE = {
            2: {bg: 'var(--c2)', color: 'var(--tc-light)'},
            4: {bg: 'var(--c4)', color: 'var(--tc-light)'},
            8: {bg: 'var(--c8)', color: 'var(--tc-dark)'},
            16: {bg: 'var(--c16)', color: 'var(--tc-dark)'},32: {bg: 'var(--c32)', color: 'var(--tc-dark)'},
            64: {bg: 'var(--c64)', color: 'var(--tc-dark)'},128: {bg: 'var(--c128)', color: 'var(--tc-dark)'},
            256: {bg: 'var(--c256)', color: 'var(--tc-dark)'},512: {bg: 'var(--c512)', color: 'var(--tc-dark)'},
            1024: {bg: 'var(--c1024)', color: 'var(--tc-dark)'},2048: {bg: 'var(--c2048)', color: 'var(--tc-dark)'},
            default: {bg: 'var(--c-max)', color: 'var(--tc-dark)'}
        };

        window.addEventListener('load', () => {
            initGame();
            bindAllEvents();
        });

        function initGame() {
            grid = Array(CELL_COUNT).fill(0).map(() => Array(CELL_COUNT).fill(0));
            score = 0;
            scoreDom.textContent = score;
            gridDom.innerHTML = '';
            isAdminMode = false;
            adminInputCache = '';
            addRandomBlock();
            addRandomBlock();
            renderCells();
            localStorage.setItem('class2048_score', 0);
        }
        function renderCells() {
            gridDom.innerHTML = '';
            for (let row = 0; row < CELL_COUNT; row++) {
                for (let col = 0; col < CELL_COUNT; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const value = grid[row][col];
                    if (value > 0) {
                        cell.textContent = BLOCK_CONFIG[value] || value;
                        const style = CELL_STYLE[value] || CELL_STYLE.default;
                        cell.style.background = style.bg;
                        cell.style.color = style.color;
                    }
                    gridDom.appendChild(cell);
                }
            }
        }

        function moveBlock(direction) {
            let hasChanged = false;
            const newGrid = JSON.parse(JSON.stringify(grid));

            switch (direction) {
                case 'up':
                    for (let col = 0; col < CELL_COUNT; col++) {
                        const merged = mergeColumn(newGrid, col, 'up');
                        if (merged.changed) hasChanged = true;
                    }
                    break;
                case 'down':
                    for (let col = 0; col < CELL_COUNT; col++) {
                        const merged = mergeColumn(newGrid, col, 'down');
                        if (merged.changed) hasChanged = true;
                    }
                    break;
                case 'left':
                    for (let row = 0; row < CELL_COUNT; row++) {
                        const merged = mergeRow(newGrid, row, 'left');
                        if (merged.changed) hasChanged = true;
                    }
                    break;
                case 'right':
                    for (let row = 0; row < CELL_COUNT; row++) {
                        const merged = mergeRow(newGrid, row, 'right');
                        if (merged.changed) hasChanged = true;
                    }
                    break;
            }

            if (hasChanged) {
                grid = newGrid;
                addRandomBlock();
                renderCells();
                scoreDom.textContent = score;
                localStorage.setItem('class2048_score', score);
            }
        }

        function mergeRow(grid, rowIdx, direction) {
            let row = grid[rowIdx].filter(num => num !== 0);
            let changed = false;
            let addScore = 0;

            for (let i = 0; i < row.length - 1; i++) {
                if (row[i] === row[i + 1]) {
                    row[i] *= 2;
                    row[i + 1] = 0;
                    addScore += row[i];
                    changed = true;
                }
            }

            row = row.filter(num => num !== 0);
            const empty = CELL_COUNT - row.length;
            if (direction === 'left') row = row.concat(Array(empty).fill(0));
            else row = Array(empty).fill(0).concat(row);

            grid[rowIdx] = row;
            score += addScore;
            return { changed };
        }

        function mergeColumn(grid, colIdx, direction) {
            let col = [];
            for (let i = 0; i < CELL_COUNT; i++) col.push(grid[i][colIdx]);
            col = col.filter(num => num !== 0);
            
            let changed = false;
            let addScore = 0;
            for (let i = 0; i < col.length - 1; i++) {
                if (col[i] === col[i + 1]) {
                    col[i] *= 2;
                    col[i + 1] = 0;
                    addScore += col[i];
                    changed = true;
                }
            }

            col = col.filter(num => num !== 0);
            const empty = CELL_COUNT - col.length;
            if (direction === 'up') col = col.concat(Array(empty).fill(0));
            else col = Array(empty).fill(0).concat(col);

            for (let i = 0; i < CELL_COUNT; i++) grid[i][colIdx] = col[i];
            score += addScore;
            return { changed };
        }

        function addRandomBlock() {
            const emptyCells = [];
            for (let i = 0; i < CELL_COUNT; i++) {
                for (let j = 0; j < CELL_COUNT; j++) {
                    if (grid[i][j] === 0) emptyCells.push({x: i, y: j});
                }
            }
            if (emptyCells.length === 0) return;
            const {x, y} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            grid[x][y] = Math.random() > 0.9 ? 4 : 2;
        }

        function bindAllEvents() {
            document.getElementById('btn-up').addEventListener('click', () => moveBlock('up'));
            document.getElementById('btn-left').addEventListener('click', () => moveBlock('left'));
            document.getElementById('btn-down').addEventListener('click', () => moveBlock('down'));
            document.getElementById('btn-right').addEventListener('click', () => moveBlock('right'));

            document.getElementById('btn-admin').addEventListener('click', () => {
                isAdminMode = true;
                adminInputCache = '';
                alert('已进入管理员验证状态，请输入密钥触发分数修改窗口（不分大小写）');
            });

            document.addEventListener('keydown', (e) => {
                if (!isAdminMode) return;
                
                const key = e.key.toLowerCase();
                if (/[0-9a-z]/.test(key)) {
                    adminInputCache += key;
                    adminInputCache = adminInputCache.slice(-7);
                    
                    if (adminInputCache === ADMIN_TRIGGER) {
                        scoreModal.style.display = 'block';
                        mask.style.display = 'block';
                        scoreInput.value = score;
                        isAdminMode = false;
                        adminInputCache = '';
                    }
                }
            });

            resetBtn.addEventListener('click', initGame);

            document.getElementById('confirm-score').addEventListener('click', () => {
                const newScore = parseInt(scoreInput.value.trim());
                if (!isNaN(newScore) && newScore >= 0) {
                    score = newScore;
                    scoreDom.textContent = score;
                    localStorage.setItem('class2048_score', score);
                    closeModal();
                    alert(`分数修改成功！当前分数：${score}`);
                } else alert('请输入有效数字（≥0）');
            });

            document.getElementById('cancel-score').addEventListener('click', closeModal);
            mask.addEventListener('click', (e) => e.target === mask && closeModal());
        }

        function closeModal() {
            scoreModal.style.display = 'none';
            mask.style.display = 'none';
            scoreInput.value = '';
        }
    </script>
</body>
</html>
