<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级2048无限版 | 特效完整版✨</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;user-select: none;-webkit-user-select: none;}
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #faf8ef;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }
        /* ✅ 截图同款公告栏 - 完全还原样式 */
        .notice-bar {
            width: 100%;
            max-width: 500px;
            height: 50px;
            line-height: 50px;
            background: #ff7f7f;
            color: #fff;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 3px 8px rgba(255,127,127,0.3);
        }
        /* 头部：分数+重置按钮 */
        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .score-box {
            background: #bbada0;
            padding: 12px 20px;
            border-radius: 10px;
            color: #fff;
            text-align: center;
        }
        .score-box .title {font-size: 14px;opacity: 0.8;}
        .score-box #score {font-size: 24px;font-weight: bold;margin-top: 4px;}
        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #8f7a66;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {background: #786553;}
        /* ✅ 游戏核心面板 - 带方块平滑移动特效 */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 500px;
            background: #bbada0;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(187,173,160,0.4);
            overflow: hidden;
        }
        .grid {
            position: absolute;
            top: 15px;left: 15px;right: 15px;bottom: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
        }
        /* ✅ 方块样式 + 平滑移动/合成特效核心 */
        .cell {
            position: absolute;
            width: calc(25% - 11.25px);
            height: calc(25% - 11.25px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #776e65;
            transition: top 0.2s ease, left 0.2s ease, transform 0.15s ease, background 0.2s ease;
            z-index: 10;
        }
        /* ✅ 方块合成特效：缩放+高亮 */
        .cell.merge {
            transform: scale(1.1);
            z-index: 20;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
        /* ✅ 截图同款排行榜 - 1:1还原样式、配色、排版 */
        .rank-box {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .rank-box h3 {
            color: #ff7f7f;
            text-align: center;
            font-size: 22px;
            margin-bottom: 18px;
            letter-spacing: 3px;
        }
        .rank-list {list-style: none;}
        .rank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 17px;
        }
        .rank-item:last-child {border: none;}
        /* 排名序号样式 - 截图同款圆形底色 */
        .rank-num {
            width: 30px;
            height: 30px;
            line-height: 30px;
            border-radius: 50%;
            text-align: center;
            color: #fff;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .rank-num.first {background: #ffd700;}
        .rank-num.second {background: #c0c0c0;}
        .rank-num.third {background: #cd7f32;}
        .rank-num.other {background: #888;}
        .rank-name {flex: 1;color: #333;font-weight: 500;}
        .rank-score {color: #ff7f7f;font-weight: bold;margin-left: 15px;}
        /* ✅ 分数修改弹窗（17c2048触发） */
        .score-modal {
            position: fixed;
            top: 50%;left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;max-width: 400px;
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 9999;
            display: none;
        }
        .score-modal h2 {
            color: #ff7f7f;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .score-modal input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 25px;
        }
        .modal-btn-group {display: flex;gap: 10px;}
        .modal-btn-group button {flex:1;padding:12px 0;}
        .confirm-btn {background: #4fc3a1;color: #fff;}
        .cancel-btn {background: #ff7f7f;color: #fff;}
        /* 遮罩层 */
        .mask {
            position: fixed;
            top:0;left:0;right:0;bottom:0;
            background: rgba(0,0,0,0.5);
            z-index: 9998;
            display: none;
        }
        /* 方块配色映射 - 适配2的幂次值 */
        :root {
            --c2:#eee4da;--c4:#ede0c8;--c8:#f2b179;--c16:#f59563;--c32:#f67c5f;
            --c64:#f65e3b;--c128:#edcf72;--c256:#edcc61;--c512:#edc850;--c1024:#edc53f;
            --c2048:#edc22e;--c-max:#3c3a32;--tc-light:#776e65;--tc-dark:#f9f6f2;
        }
        /* 响应式适配手机 */
        @media (max-width: 500px) {
            .game-container {width: 100%;height: calc(100vw - 30px);}
            .cell {font-size: 5vw;}
            .notice-bar {font-size: 16px;height: 45px;line-height: 45px;}
            .rank-item {font-size: 15px;}
        }
    </style>
</head>
<body>
    <!-- ✅ 【代码修改区1】公告栏 - 直接改文字即可 -->
    <div class="notice-bar">📢 想上榜分数截图发谢欣智📢</div>

    <!-- 头部：分数展示+重置按钮 -->
    <div class="header">
        <div class="score-box">
            <div class="title">我的分数</div>
            <div id="score">0</div>
        </div>
        <button class="btn" id="reset-game">重置游戏</button>
    </div>

    <!-- 游戏核心区 -->
    <div class="game-container">
        <div class="grid" id="grid"></div>
    </div>

    <!-- ✅ 【代码修改区2】排行榜 - 直接改名字/分数，完全还原截图样式 -->
    <div class="rank-box">
        <h3>🏆 班级高分榜 🏆</h3>
        <ul class="rank-list" id="rank-list">
            <li class="rank-item">
                <span class="rank-num first">1</span>
                <span class="rank-name">谢欣智</span>
                <span class="rank-score">4096</span>
            </li>
            <li class="rank-item">
                <span class="rank-num second">2</span>
                <span class="rank-name">暂无</span>
                <span class="rank-score">0</span>
            </li>
            <li class="rank-item">
                <span class="rank-num third">3</span>
                <span class="rank-name">暂无</span>
                <span class="rank-score">0</span>
            </li>
            <li class="rank-item">
                <span class="rank-num other">4</span>
                <span class="rank-name">暂无</span>
                <span class="rank-score">0</span>
            </li>
            <li class="rank-item">
                <span class="rank-num other">5</span>
                <span class="rank-name">暂无</span>
                <span class="rank-score">0</span>
            </li>
        </ul>
    </div>

    <!-- 遮罩层 -->
    <div class="mask" id="mask"></div>

    <!-- 分数修改弹窗 -->
    <div class="score-modal" id="score-modal">
        <h2>✏️ 修改当前分数</h2>
        <input type="number" id="score-input" placeholder="输入目标分数，例如999999999" min="0">
        <div class="modal-btn-group">
            <button class="btn confirm-btn" id="confirm-score">确认修改</button>
            <button class="btn cancel-btn" id="cancel-score">取消关闭</button>
        </div>
    </div>

    <script>
        // ========== ✅ 全局配置【代码修改区3】方块值/梗自定义、核心参数 ==========
        const gridDom = document.getElementById('grid');
        const scoreDom = document.getElementById('score');
        const resetBtn = document.getElementById('reset-game');
        const scoreModal = document.getElementById('score-modal');
        const mask = document.getElementById('mask');
        const scoreInput = document.getElementById('score-input');
        const CELL_COUNT = 4; // 4x4网格
        const CELL_GAP = 15;  // 方块间距
        let grid = [];        // 游戏数据网格
        let score = 0;        // 当前分数
        let cells = [];       // 方块DOM集合
        let isAnimating = false; // 动画锁：防止移动中重复操作

        // ✅ 方块配置：2/4/8...2147483648，直接改引号内内容替换成班级梗/表情
        const BLOCK_CONFIG = {
            2: '2',4:'4',8:'8',16:'16',32:'32',64:'64',128:'128',256:'256',
            512:'512',1024:'1024',2048:'2048',4096:'4096',8192:'8192',16384:'16384',
            32768:'32768',65536:'65536',131072:'131072',262144:'262144',524288:'524288',
            1048576:'1048576',2097152:'2097152',4194304:'4194304',8388608:'8388608',
            16777216:'16777216',33554432:'33554432',67108864:'67108864',134217728:'134217728',
            268435456:'268435456',536870912:'536870912',1073741824:'1073741824',2147483648:'2147483648'
        };

        // 方块配色&文字色映射
        const CELL_STYLE = {
            2: {bg: 'var(--c2)', color: 'var(--tc-light)'},
            4: {bg: 'var(--c4)', color: 'var(--tc-light)'},
            8: {bg: 'var(--c8)', color: 'var(--tc-dark)'},
            16: {bg: 'var(--c16)', color: 'var(--tc-dark)'},32: {bg: 'var(--c32)', color: 'var(--tc-dark)'},
            64: {bg: 'var(--c64)', color: 'var(--tc-dark)'},128: {bg: 'var(--c128)', color: 'var(--tc-dark)'},
            256: {bg: 'var(--c256)', color: 'var(--tc-dark)'},512: {bg: 'var(--c512)', color: 'var(--tc-dark)'},
            1024: {bg: 'var(--c1024)', color: 'var(--tc-dark)'},2048: {bg: 'var(--c2048)', color: 'var(--tc-dark)'},
            default: {bg: 'var(--c-max)', color: 'var(--tc-dark)'}
        };

        // 分数弹窗触发按键：1→7→c→2→0→4→8
        const TRIGGER_KEYS = ['1','7','c','2','0','4','8'];
        let keyCache = [];

        // ========== 初始化游戏 ==========
        window.addEventListener('load', () => {
            initGame();
            bindAllEvents();
        });

        function initGame() {
            grid = Array(CELL_COUNT).fill(0).map(() => Array(CELL_COUNT).fill(0));
            score = 0;
            scoreDom.textContent = score;
            gridDom.innerHTML = '';
            cells = [];
            isAnimating = false;
            addRandomBlock();
            addRandomBlock();
            renderCells();
            localStorage.setItem('class2048_score', 0);
        }

        // ========== ✅ 核心特效1：方块平滑移动+精准坐标定位 ==========
        function renderCells() {
            gridDom.innerHTML = '';
            const cellSize = (gridDom.clientWidth - CELL_GAP * (CELL_COUNT - 1)) / CELL_COUNT;
            for (let row = 0; row < CELL_COUNT; row++) {
                for (let col = 0; col < CELL_COUNT; col++) {
                    const value = grid[row][col];
                    if (value === 0) continue;
                    
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.value = value;
                    cell.textContent = BLOCK_CONFIG[value] || value;
                    
                    // 计算方块坐标 - 实现精准定位
                    const x = col * (cellSize + CELL_GAP);
                    const y = row * (cellSize + CELL_GAP);
                    cell.style.left = `${x}px`;
                    cell.style.top = `${y}px`;
                    cell.style.width = `${cellSize}px`;
                    cell.style.height = `${cellSize}px`;

                    // 设置配色
                    const style = CELL_STYLE[value] || CELL_STYLE.default;
                    cell.style.background = style.bg;
                    cell.style.color = style.color;

                    gridDom.appendChild(cell);
                    cells.push(cell);
                }
            }
        }

        // ========== ✅ 核心特效2：方块合并缩放+高亮动画 ==========
        async function moveBlock(direction) {
            if (isAnimating) return;
            isAnimating = true;
            let hasChanged = false;
            const newGrid = JSON.parse(JSON.stringify(grid));

            switch (direction) {
                case 'up':
                    for (let col = 0; col < CELL_COUNT; col++) {
                        const merged = mergeColumn(newGrid, col, 'up');
                        if (merged.changed) hasChanged = true;
                    }
                    break;
                case 'down':
                    for (let col = 0; col < CELL_COUNT; col++) {
                        const merged = mergeColumn(newGrid, col, 'down');
                        if (merged.changed) hasChanged = true;
                    }
                    break;
                case 'left':
                    for (let row = 0; row < CELL_COUNT; row++) {
                        const merged = mergeRow(newGrid, row, 'left');
                        if (merged.changed) hasChanged = true;
                    }
                    break;
                case 'right':
                    for (let row = 0; row < CELL_COUNT; row++) {
                        const merged = mergeRow(newGrid, row, 'right');
                        if (merged.changed) hasChanged = true;
                    }
                    break;
            }

            if (hasChanged) {
                grid = newGrid;
                renderCells();
                // 等待移动动画完成后，添加合并特效
                await new Promise(resolve => setTimeout(resolve, 220));
                addMergeEffect();
                // 生成新方块
                setTimeout(() => {
                    addRandomBlock();
                    renderCells();
                    isAnimating = false;
                }, 250);
            } else {
                isAnimating = false;
            }
        }

        // 合并特效：缩放+高亮
        function addMergeEffect() {
            const valueMap = {};
            cells.forEach(cell => {
                const val = cell.dataset.value;
                const pos = `${cell.style.top}-${cell.style.left}`;
                if (!valueMap[val]) valueMap[val] = [];
                valueMap[val].push({cell, pos});
            });

            for (const val in valueMap) {
                const group = valueMap[val];
                if (group.length >= 2) {
                    group.forEach(item => {
                        item.cell.classList.add('merge');
                        setTimeout(() => item.cell.classList.remove('merge'), 150);
                    });
                }
            }
        }

        // ========== 游戏核心逻辑（合并/生成方块） ==========
        function mergeRow(grid, rowIdx, direction) {
            let row = grid[rowIdx].filter(num => num !== 0);
            let changed = false;
            let addScore = 0;

            for (let i = 0; i < row.length - 1; i++) {
                if (row[i] === row[i + 1]) {
                    row[i] *= 2;
                    row[i + 1] = 0;
                    addScore += row[i];
                    changed = true;
                }
            }

            row = row.filter(num => num !== 0);
            const empty = CELL_COUNT - row.length;
            if (direction === 'left') row = row.concat(Array(empty).fill(0));
            else row = Array(empty).fill(0).concat(row);

            grid[rowIdx] = row;
            score += addScore;
            scoreDom.textContent = score;
            localStorage.setItem('class2048_score', score);
            return { changed };
        }

        function mergeColumn(grid, colIdx, direction) {
            let col = [];
            for (let i = 0; i < CELL_COUNT; i++) col.push(grid[i][colIdx]);
            col = col.filter(num => num !== 0);
            
            let changed = false;
            let addScore = 0;
            for (let i = 0; i < col.length - 1; i++) {
                if (col[i] === col[i + 1]) {
                    col[i] *= 2;
                    col[i + 1] = 0;
                    addScore += col[i];
                    changed = true;
                }
            }

            col = col.filter(num => num !== 0);
            const empty = CELL_COUNT - col.length;
            if (direction === 'up') col = col.concat(Array(empty).fill(0));
            else col = Array(empty).fill(0).concat(col);

            for (let i = 0; i < CELL_COUNT; i++) grid[i][colIdx] = col[i];
            score += addScore;
            scoreDom.textContent = score;
            localStorage.setItem('class2048_score', score);
            return { changed };
        }

        // 生成随机方块（2/4）
        function addRandomBlock() {
            const emptyCells = [];
            for (let i = 0; i < CELL_COUNT; i++) {
                for (let j = 0; j < CELL_COUNT; j++) {
                    if (grid[i][j] === 0) emptyCells.push({x: i, y: j});
                }
            }
            if (emptyCells.length === 0) return;
            const {x, y} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            grid[x][y] = Math.random() > 0.9 ? 4 : 2;
        }

        // ========== ✅ 按键绑定：WASD移动 + 17c2048触发改分窗口 ==========
        function bindAllEvents() {
            // WASD控制移动
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (['w','a','s','d'].includes(key)) {
                    e.preventDefault();
                    switch(key) {
                        case 'w': moveBlock('up'); break;
                        case 'a': moveBlock('left'); break;
                        case 's': moveBlock('down'); break;
                        case 'd': moveBlock('right'); break;
                    }
                }

                // 17c2048触发分数弹窗
                keyCache.push(key);
                keyCache = keyCache.slice(-7);
                if (keyCache.join('') === TRIGGER_KEYS.join('')) {
                    scoreModal.style.display = 'block';
                    mask.style.display = 'block';
                    scoreInput.value = score;
                    keyCache = [];
                }
            });

            // 重置游戏
            resetBtn.addEventListener('click', initGame);

            // 分数弹窗事件
            document.getElementById('confirm-score').addEventListener('click', () => {
                const newScore = parseInt(scoreInput.value.trim());
                if (!isNaN(newScore) && newScore >= 0) {
                    score = newScore;
                    scoreDom.textContent = score;
                    localStorage.setItem('class2048_score', score);
                    closeModal();
                    alert(`分数修改成功！当前分数：${score}`);
                } else alert('请输入有效数字（≥0）');
            });

            document.getElementById('cancel-score').addEventListener('click', closeModal);
            mask.addEventListener('click', (e) => e.target === mask && closeModal());

            // 手机触屏适配
            let startX, startY;
            gridDom.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });
            gridDom.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;
                if (Math.abs(dx) > Math.abs(dy)) {
                    moveBlock(dx > 0 ? 'right' : 'left');
                } else {
                    moveBlock(dy > 0 ? 'down' : 'up');
                }
            });
        }

        // 关闭分数弹窗
        function closeModal() {
            scoreModal.style.display = 'none';
            mask.style.display = 'none';
            scoreInput.value = '';
        }
    </script>
</body>
</html>
